# LiFlow universal corrector training configuration.
#
# The corrector refines each current frame toward its noise-free endpoint using
# the same flow-matching velocity field but is trained on a noised-frame
# construction (single current frame + UniformScaleNormalPrior(scale=0.25),
# with a MaxwellBoltzmannPrior(scale=0.1) corrector prior) --- distinct from the
# propagator's time-delayed pair + adaptive prior.
#
# NOTE: the shared ``LiFlowDataset`` currently builds time-delayed endpoint
# pairs.  The dedicated noised-frame dataset construction is tracked with the
# corrector data pipeline; until it exists the corrector config reuses the same
# trainable dataset so the entrypoint and smoke test remain runnable.  Both the
# propagator and the corrector keep the reference default
# ``prediction_mode: velocity`` (never switched to ``data``).

Global:
  do_train: true
  do_eval: true
  do_test: false
  prim_eager_enabled: false

Trainer:
  output_dir: output/liflow_universal_corrector
  max_epochs: 500
  max_iter: null
  seed: 42
  compute_metric_during_train: false
  save_freq: 10
  log_freq: 10
  start_eval_epoch: 1
  eval_freq: 1
  use_amp: false
  eval_with_no_grad: true
  best_metric_indicator: eval_loss
  name_for_best_metric: loss
  greater_is_better: false

Model:
  __class_name__: LiFlow
  __init_params__:
    num_features: 64
    num_radial_basis: 20
    num_layers: 3
    num_elements: 77
    r_max: 5.0
    r_offset: 0.5
    ref_temp: 1000.0
    prediction_mode: velocity

Metric:
  velocity:
    __class_name__: LiFlowMSE
    __init_params__: {}

Optimizer:
  __class_name__: Adam
  clip_norm: 10.0
  __init_params__:
    beta1: 0.9
    beta2: 0.999
    lr: 0.0003

Execution:
  backend: eager
  __init_params__:
    full_graph: false

Dataset:
  train:
    dataset:
      __class_name__: LiFlowDataset
      __init_params__:
        path: data/liflow
        split: train
        time_delay_steps: 100
        cutoff: 5.0
        periodic: true
        seed: 42
        overwrite: false
    loader:
      num_workers: 2
      use_shared_memory: false
      collate_fn: LiFlowCollator
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 16
        shuffle: true
        drop_last: false
  val:
    dataset:
      __class_name__: LiFlowDataset
      __init_params__:
        path: data/liflow
        split: val
        time_delay_steps: 100
        cutoff: 5.0
        periodic: true
        seed: 42
        overwrite: false
    loader:
      num_workers: 2
      use_shared_memory: false
      collate_fn: LiFlowCollator
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 16
        shuffle: false
        drop_last: false
