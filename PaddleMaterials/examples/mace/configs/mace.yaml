model:
  r_max: 5.0
  num_radial_basis: 8
  num_cutoff_basis: 5
  max_ell: 3
  correlation: 3
  hidden_irreps: "128x0e + 64x1o"
  num_channels: 128
  num_blocks: 2

loss:
  energy_weight: 0.01
  force_weight: 100.0
  stress_weight: 0.01

optimizer:
  learning_rate: 0.001
  weight_decay: 0.00001
  batch_size: 32

training:
  max_num_epochs: 100
  save_every: 10
  eval_every: 1
  output_dir: "./outputs/mace"

data:
  train_path: "./data/xyz/MPtrj_train.xyz"
  val_path: "./data/xyz/MPtrj_valid.xyz"
  test_path: "./data/xyz/MPtrj_test.xyz"
  processed_dir: "./data/processed/"
